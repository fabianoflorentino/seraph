name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          commit="${GITHUB_SHA::7}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/fabianoflorentino/seraph/internal/version.Version=${VERSION} -X github.com/fabianoflorentino/seraph/internal/version.Commit=${commit} -X github.com/fabianoflorentino/seraph/internal/version.Date=${date}" \
            -o "dist/seraph-linux-${GOARCH}" ./cmd/seraph
          tar -C dist -czf "dist/seraph_${VERSION}_linux_${GOARCH}.tar.gz" "seraph-linux-${GOARCH}"
          rm "dist/seraph-linux-${GOARCH}"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
