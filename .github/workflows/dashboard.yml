name: Dashboard

on:
  workflow_dispatch:
  schedule:
    # Fallback only: Cloudflare dispatches every five minutes.
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "catalog/**"
      - "config/**"
      - "site/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Collect and build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: |
          go build -trimpath \
            -ldflags "-X github.com/fabianoflorentino/seraph/internal/version.Version=${GITHUB_SHA::7} -X github.com/fabianoflorentino/seraph/internal/version.Commit=${GITHUB_SHA::7} -X github.com/fabianoflorentino/seraph/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/seraph ./cmd/seraph
      - name: Validate catalog
        run: ./bin/seraph validate --catalog catalog/packs
      - name: Restore previous snapshot
        run: |
          mkdir -p site/static/data
          pages_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/state.json"
          if curl -fsSL -H "Cache-Control: no-cache" "${pages_url}?ts=$(date +%s)" -o site/static/data/state.json; then
            echo "restored previous snapshot for history"
          else
            rm -f site/static/data/state.json
            echo "no previous snapshot; starting history fresh"
          fi
      - name: Collect snapshot
        run: ./bin/seraph sync --catalog catalog/packs
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.158.0"
      - name: Build site
        run: hugo --source site --minify --gc --cleanDestinationDir
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://seraph.fabianoflorentino.dev/
    steps:
      # Pages creation can return a transient 5xx. Retry with exponential
      # backoff starting at 1 min, doubling up to 1 h; the final attempt
      # failing marks the job failed so the outage is visible.
      - name: Deploy to Pages (attempt 1)
        id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 1m before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 2m before retry
        if: steps.deploy2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to Pages (attempt 3)
        id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 4m before retry
        if: steps.deploy3.outcome == 'failure'
        run: sleep 240

      - name: Deploy to Pages (attempt 4)
        id: deploy4
        if: steps.deploy3.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 8m before retry
        if: steps.deploy4.outcome == 'failure'
        run: sleep 480

      - name: Deploy to Pages (attempt 5)
        id: deploy5
        if: steps.deploy4.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 16m before retry
        if: steps.deploy5.outcome == 'failure'
        run: sleep 960

      - name: Deploy to Pages (attempt 6)
        id: deploy6
        if: steps.deploy5.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 32m before retry
        if: steps.deploy6.outcome == 'failure'
        run: sleep 1920

      - name: Deploy to Pages (attempt 7)
        id: deploy7
        if: steps.deploy6.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 60m before final retry
        if: steps.deploy7.outcome == 'failure'
        run: sleep 3600

      - name: Deploy to Pages (final attempt)
        id: deploy8
        if: steps.deploy7.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Fail after exhausting retries
        if: steps.deploy8.outcome == 'failure'
        run: |
          echo "::error::Pages deployment failed after all retries (max backoff 1h)."
          exit 1
