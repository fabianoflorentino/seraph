# Required secrets (Settings -> Secrets and variables -> Actions):
#
#   Environment: DOCKERHUB
#     DOCKERHUB_USERNAME  Docker Hub login name
#     DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
#
# The image job publishes `edge` from main and semver tags from `v*` tags.
# When the secrets are absent the workflow stays green and skips publishing.

name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cmd/**"
      - "internal/**"
      - "catalog/**"
      - "config/**"
      - "site/**"
      - "docker/**"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Docker Hub
    environment: DOCKERHUB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Docker Hub credentials
        id: creds
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Docker Hub secrets are not configured; image publish skipped."
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: steps.creds.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: fabianoflorentino/seraph
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Build and push
        if: steps.creds.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HUGO_BASEURL=https://seraph.srectl.fabianoflorentino.dev/
          cache-from: type=gha
          cache-to: type=gha,mode=max
